[project]
name = "my_python_coder"
version = "0.1.0"
description = "my_python_coder using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=0.203.1,<1.0.0"
]

[project.scripts]
my_python_coder = "my_python_coder.main:run"
run_crew = "my_python_coder.main:run"
train = "my_python_coder.main:train"
replay = "my_python_coder.main:replay"
test = "my_python_coder.main:test"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
